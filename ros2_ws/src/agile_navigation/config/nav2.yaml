map_server:
  ros__parameters:
    use_sim_time: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.1
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_planning_time: 3.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      minimum_turning_radius: 4.0
      analytic_expansion_max_length: 20.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      smooth_path: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odometry/wheel
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.6
      lookahead_dist: 2.5
      min_lookahead_dist: 1.5
      max_lookahead_dist: 3.0
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: false
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      transform_tolerance: 0.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 4.0
      regulated_linear_scaling_min_speed: 0.15
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/wheel
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      footprint: '[[2.47,0.8],[2.47,-0.8],[-0.63,-0.8],[-0.63,0.8]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: lidar
        lidar:
          topic: /sensors/obstacle_scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.5
          obstacle_min_range: 1.0
          obstacle_max_range: 12.0
          raytrace_min_range: 1.0
          raytrace_max_range: 15.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.4
        cost_scaling_factor: 3.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.1
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      track_unknown_space: true
      footprint: '[[2.47,0.8],[2.47,-0.8],[-0.63,-0.8],[-0.63,0.8]]'
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.4
        cost_scaling_factor: 3.0
