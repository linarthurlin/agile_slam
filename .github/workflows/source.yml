name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r scripts/requirements-scenes.txt
      - run: python scripts/check_source.py
      - run: python scripts/generate_scene.py --check
      - run: python -m unittest discover -s tests -v
